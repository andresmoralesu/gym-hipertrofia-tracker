name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Chrome de escritorio + iPhone 14 emulado. Es el job que decide si el commit está bien.
  e2e:
    name: e2e (escritorio + iPhone emulado)
    # Versión fija: "ubuntu-latest" está migrando a Ubuntu 26, que Playwright aún no soporta.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar Chromium
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Tests E2E (escritorio + iPhone 14 emulado)
        timeout-minutes: 10
        run: npx playwright test --project=desktop-chromium --project=iphone-14-chromium

      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Safari real (WebKit). Informativo: si falla, no marca en rojo todo el commit.
  e2e-safari:
    name: e2e (Safari / WebKit, informativo)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El mirror de paquetes de Ubuntu a veces se queda colgado a mitad de la descarga.
      # apt reintenta y corta las descargas detenidas; además el paso se repite hasta 3 veces.
      - name: Instalar WebKit
        timeout-minutes: 12
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-reintentos
          for intento in 1 2 3; do
            echo "Instalando WebKit, intento $intento de 3"
            if timeout -k 10 200 npx playwright install --with-deps webkit; then
              exit 0
            fi
            echo "Falló o se colgó; limpiando apt y reintentando..."
            sudo pkill -f apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Tests E2E (Safari / WebKit)
        timeout-minutes: 8
        run: npx playwright test --project=iphone-14-safari
        env:
          WEBKIT: '1'

      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-safari
          path: playwright-report/
          retention-days: 14
