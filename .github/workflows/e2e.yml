name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Chrome de escritorio + iPhone 14 emulado. Es el job que decide si el commit está bien.
  e2e:
    name: e2e (escritorio + iPhone emulado)
    # Versión fija: "ubuntu-latest" está migrando a Ubuntu 26, que Playwright aún no soporta.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar Chromium
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Tests E2E (escritorio + iPhone 14 emulado)
        timeout-minutes: 10
        run: npx playwright test --project=desktop-chromium --project=iphone-14-chromium

      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Safari real (WebKit). Informativo: si falla, no marca en rojo todo el commit.
  e2e-safari:
    name: e2e (Safari / WebKit, informativo)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar WebKit
        timeout-minutes: 6
        run: npx playwright install --with-deps webkit

      - name: Tests E2E (Safari / WebKit)
        timeout-minutes: 8
        run: npx playwright test --project=iphone-14-safari
        env:
          WEBKIT: '1'

      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-safari
          path: playwright-report/
          retention-days: 14
